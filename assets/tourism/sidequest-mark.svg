<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">SideQuest Tourism compass app icon</title>
  <!-- Redrawn from the app icon on the SideQuest Tourism poster: purple-to-magenta tile with a white compass. -->
  <defs>
    <linearGradient id="sq-g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5a18cf"/>
      <stop offset=".45" stop-color="#8a22d4"/>
      <stop offset="1" stop-color="#ed36b8"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#sq-g)"/>
  <circle cx="64" cy="64" r="34" fill="none" stroke="#fff" stroke-width="7"/>
  <path d="M79 49 69 69 49 79 59 59z" fill="#fff"/>
  <circle cx="64" cy="64" r="3.5" fill="url(#sq-g)"/>
</svg>
