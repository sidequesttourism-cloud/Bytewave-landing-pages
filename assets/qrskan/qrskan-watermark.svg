<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- QRskan mark as a one-colour watermark: the ticket is solid, and the Q and perforations are cut out of it. -->
  <defs>
    <mask id="m">
      <rect x="8" y="8" width="112" height="112" rx="22" fill="#fff"/>
      <circle cx="8" cy="64" r="10" fill="#000"/>
      <circle cx="120" cy="64" r="10" fill="#000"/>
      <path d="M84 84 101 101" stroke="#000" stroke-width="13" stroke-linecap="round"/>
      <circle cx="61" cy="59" r="28" fill="none" stroke="#000" stroke-width="13"/>
      <path d="M23 64h12M93 64h12" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 7"/>
    </mask>
  </defs>
  <rect width="128" height="128" fill="#fff8e7" mask="url(#m)"/>
</svg>
